[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skmc-erp-ar-backend"
version = "0.1.0"
description = "SKMC ERP SaaS backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.10,<3.0",
    "tzdata>=2026.1",
    "phonenumbers>=9.0,<10.0",
    "python-stdnum>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/skmc_erp"]
